services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    command: serve

  api:
    build: .
    command: uvicorn services.web.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@db:5432/discord_tasks
      BACKEND_URL: http://create-task.ru
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: python run.py
    env_file:
      - .env
    environment:
      BACKEND_URL: http://api:8000
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@db:5432/discord_tasks
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
  ollama_data:
