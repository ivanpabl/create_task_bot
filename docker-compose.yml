services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_tasks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    command: serve

  api:
    build: .
    # WS limits/heartbeat are enforced by uvicorn before frames reach the app.
    # TLS terminates at the reverse proxy in front of this port; never expose it directly.
    command: >
      uvicorn services.web.main:app --host 0.0.0.0 --port 8000
      --ws-max-size 65536 --ws-ping-interval 20 --ws-ping-timeout 20
      --proxy-headers
    ports:
      - "127.0.0.1:8100:8000"
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@db:5432/discord_tasks
      BACKEND_URL: https://create-task.ru
      OLLAMA_URL: http://ollama:11434
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      # Addresses of the reverse proxy allowed to set X-Forwarded-For (needed for per-IP rate limits).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: python run.py
    env_file:
      - .env
    environment:
      BACKEND_URL: http://api:8000
      POSTGRES_DSN: postgresql+asyncpg://postgres:postgres@db:5432/discord_tasks
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
  chdata:
  ollama_data:
