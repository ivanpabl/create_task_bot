[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra
markers =
    postgres: integration tests against a real PostgreSQL (set TEST_POSTGRES_DSN)
    clickhouse: tests of the ClickHouse mart (set TEST_CLICKHOUSE_URL)
filterwarnings =
    ignore::DeprecationWarning
